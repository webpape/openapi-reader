<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>404 Not Found · eZmax API Reference</title>
      <meta name="description" content="This route does not exist in eZmax API Reference" />
      <meta name="theme-color" content="#131316" />
      <link rel="icon" type="image/svg+xml" href="/icons/hub-logo.svg" />
      <link rel="icon" href="/favicon.ico" sizes="any" />
      <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap"
         rel="stylesheet"
      />
      <style>
         :root {
            color-scheme: dark;
            --or-topbar: #131316;
            --or-page-bg: #1b1b1f;
            --or-card-bg: #202127;
            --or-text: #dfdfd6;
            --or-muted: #98989f;
            --or-line: rgba(255, 255, 255, 0.085);
            --p-primary: #7fa3c7;
            --p-primary-hover: #94b4d4;
         }

         * {
            box-sizing: border-box;
         }

         html,
         body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--or-page-bg);
            color: var(--or-text);
            font-family: 'Source Sans 3', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
         }

         .shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
         }

         /* Topbar */
         .topbar {
            height: 48px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 0 16px;
            background: var(--or-topbar);
            border-bottom: 1px solid var(--or-line);
            position: sticky;
            top: 0;
            z-index: 20;
         }

         .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
         }

         .logo {
            height: 26px;
            width: auto;
            object-fit: contain;
         }

         .brand-title {
            font-family: 'Source Sans 3', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--or-text);
            white-space: nowrap;
         }

         .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
         }

         .portal-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 28px;
            padding: 0 12px;
            font-size: 13px;
            font-weight: 500;
            color: var(--or-text);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--or-line);
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.15s, border-color 0.15s, color 0.15s;
         }

         .portal-link:hover {
            background: rgba(127, 163, 199, 0.14);
            border-color: rgba(127, 163, 199, 0.45);
            color: var(--p-primary);
         }

         /* Main Content */
         .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
         }

         .not-found-card {
            width: 100%;
            max-width: 620px;
            padding: 32px 28px 36px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--or-card-bg);
            border: 1px solid var(--or-line);
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
         }

         .nf-visual {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 4px;
         }

         .nf-illustration {
            width: 100%;
            max-width: 210px;
            height: auto;
            color: var(--p-primary);
            opacity: 0.9;
            margin-bottom: -8px;
         }

         .nf-wave {
            opacity: 0.28;
            transform-origin: 160px 90px;
         }

         .nf-wave-1 {
            animation: rotateRadar 12s linear infinite;
         }

         .nf-wave-2 {
            animation: rotateRadar 8s linear infinite reverse;
         }

         .nf-radar-beam {
            opacity: 0.55;
            transform-origin: 160px 90px;
            animation: rotateRadar 4s linear infinite;
         }

         .nf-satellite {
            animation: floatSat 4s ease-in-out infinite;
            transform-origin: 160px 90px;
         }

         .nf-sat-body {
            fill: var(--or-card-bg);
            stroke: currentColor;
            stroke-width: 2;
         }

         .nf-sat-panel {
            fill: rgba(127, 163, 199, 0.25);
            stroke: currentColor;
            stroke-width: 1.5;
         }

         .nf-sat-beacon {
            fill: #ef4444;
            animation: beaconBlink 1s infinite;
         }

         .nf-sat-eye {
            fill: var(--p-primary);
         }

         .nf-star {
            opacity: 0.45;
            animation: twinkle 3s infinite ease-in-out alternate;
         }

         .nf-star-2 {
            animation-delay: 1s;
         }

         .nf-star-3 {
            animation-delay: 1.8s;
         }

         .nf-huge-code {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 76px;
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, var(--p-primary), #818cf8 60%, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            user-select: none;
            margin-top: 4px;
         }

         .nf-title {
            margin: 12px 0 8px;
            font-family: 'Cabin', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: var(--or-text);
            line-height: 1.25;
         }

         .nf-subtitle {
            margin: 0 0 16px;
            font-size: 14.5px;
            line-height: 1.5;
            color: var(--or-muted);
            max-width: 480px;
         }

         .nf-missing-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            max-width: 100%;
            padding: 6px 14px;
            margin-bottom: 24px;
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid var(--or-line);
            border-radius: 8px;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 12.5px;
            color: #fca5a5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
         }

         .nf-missing-box span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
         }

         /* Actions */
         .nf-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            width: 100%;
         }

         .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 36px;
            padding: 0 16px;
            font-size: 13.5px;
            font-weight: 600;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s, color 0.15s;
            border: 1px solid transparent;
            font-family: inherit;
         }

         .btn-primary {
            background: var(--p-primary);
            color: #131316;
         }

         .btn-primary:hover {
            background: var(--p-primary-hover);
         }

         .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--or-text);
            border-color: var(--or-line);
         }

         .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.09);
         }

         @keyframes rotateRadar {
            from {
               transform: rotate(0deg);
            }
            to {
               transform: rotate(360deg);
            }
         }

         @keyframes floatSat {
            0%,
            100% {
               transform: translateY(0px) rotate(0deg);
            }
            50% {
               transform: translateY(-5px) rotate(-2.5deg);
            }
         }

         @keyframes beaconBlink {
            0%,
            100% {
               opacity: 1;
               filter: drop-shadow(0 0 3px #ef4444);
            }
            50% {
               opacity: 0.25;
               filter: none;
            }
         }

         @keyframes twinkle {
            0% {
               opacity: 0.2;
               transform: scale(0.8);
            }
            100% {
               opacity: 0.85;
               transform: scale(1.2);
            }
         }

         @media (max-width: 600px) {
            .not-found-card {
               padding: 24px 18px 28px;
            }

            .nf-huge-code {
               font-size: 60px;
            }

            .nf-title {
               font-size: 19px;
            }

            .nf-actions {
               flex-direction: column;
            }

            .btn {
               width: 100%;
            }
         }
      </style>
   </head>
   <body>
      <div class="shell">
         <header class="topbar">
            <a href="/" class="brand" title="eZmax API Reference">
               <img src="/logo-dark.svg" alt="eZmax" class="logo" />
               <span class="brand-title">eZmax API Reference</span>
            </a>
            <div class="top-actions">
               <a
                  class="portal-link"
                  href="https://ezmax.dev"
                  target="_blank"
                  rel="noreferrer"
               >
                  <span>Developer Portal</span>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                     <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                     <polyline points="15 3 21 3 21 9"></polyline>
                     <line x1="10" y1="14" x2="21" y2="3"></line>
                  </svg>
               </a>
            </div>
         </header>

         <main class="main">
            <div class="not-found-card">
               <div class="nf-visual">
                  <svg
                     class="nf-illustration"
                     viewBox="0 0 320 180"
                     fill="none"
                     xmlns="http://www.w3.org/2000/svg"
                     aria-hidden="true"
                  >
                     <circle cx="160" cy="90" r="70" class="nf-wave nf-wave-1" stroke="currentColor" stroke-dasharray="4 6" />
                     <circle cx="160" cy="90" r="50" class="nf-wave nf-wave-2" stroke="currentColor" stroke-dasharray="3 5" />
                     <circle cx="160" cy="90" r="30" class="nf-wave" stroke="currentColor" />
                     <line x1="160" y1="90" x2="230" y2="40" class="nf-radar-beam" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                     <g class="nf-satellite">
                        <rect x="145" y="78" width="30" height="24" rx="6" class="nf-sat-body" />
                        <line x1="133" y1="90" x2="145" y2="90" stroke="currentColor" stroke-width="2.5" />
                        <line x1="175" y1="90" x2="187" y2="90" stroke="currentColor" stroke-width="2.5" />
                        <rect x="120" y="82" width="13" height="16" rx="2" class="nf-sat-panel" />
                        <rect x="187" y="82" width="13" height="16" rx="2" class="nf-sat-panel" />
                        <line x1="160" y1="78" x2="160" y2="66" stroke="currentColor" stroke-width="2" />
                        <circle cx="160" cy="64" r="3.5" class="nf-sat-beacon" />
                        <circle cx="154" cy="88" r="2.5" class="nf-sat-eye" />
                        <circle cx="166" cy="88" r="2.5" class="nf-sat-eye" />
                     </g>
                     <circle cx="40" cy="30" r="1.5" class="nf-star" fill="currentColor" />
                     <circle cx="280" cy="45" r="1.5" class="nf-star nf-star-2" fill="currentColor" />
                     <circle cx="260" cy="140" r="1" class="nf-star nf-star-3" fill="currentColor" />
                     <circle cx="65" cy="135" r="1.2" class="nf-star" fill="currentColor" />
                     <circle cx="105" cy="40" r="1" class="nf-star" fill="currentColor" />
                  </svg>

                  <div class="nf-huge-code">404</div>
               </div>

               <h1 class="nf-title">Houston, this route does not exist.</h1>

               <p class="nf-subtitle">
                  We searched the entire specification, but this requested route was nowhere to be found.
               </p>

               <div id="missing-box" class="nf-missing-box" style="display: none">
                  <span>Target: <strong id="missing-path"></strong></span>
               </div>

               <div class="nf-actions">
                  <a href="/" class="btn btn-primary">
                     <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                     </svg>
                     <span>Back to home</span>
                  </a>
                  <button type="button" class="btn btn-secondary" onclick="if (history.length > 1) { history.back(); } else { window.location.href = '/'; }">
                     <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"></polyline>
                     </svg>
                     <span>Go back</span>
                  </button>
                  <a href="/changelog" class="btn btn-secondary">
                     <span>View changelog</span>
                  </a>
               </div>
            </div>
         </main>
      </div>

      <script>
         // Display missing pathname if provided in URL
         try {
            var path = window.location.pathname;
            if (path && path !== '/' && path !== '/404.html') {
               var missingBox = document.getElementById('missing-box');
               var missingPath = document.getElementById('missing-path');
               if (missingBox && missingPath) {
                  missingPath.textContent = path + window.location.search + window.location.hash;
                  missingBox.style.display = 'inline-flex';
               }
            }
         } catch (e) {}
      </script>
   </body>
</html>
